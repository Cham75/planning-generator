name: Apply Planning Assistance v6

on:
  push:
    branches:
      - feature/supervisor-planning-rules-v6
    paths:
      - .github/workflows/apply-v6.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/supervisor-planning-rules-v6
          fetch-depth: 0
      - name: Apply tested v6 source files
        shell: bash
        run: |
          set -euo pipefail
          cat .v6_payload/part_00 .v6_payload/part_01 .v6_payload/part_02 .v6_payload/part_03 | base64 --decode > /tmp/v6_payload.tar.gz
          echo "5e03ee138441d2656e1e0be4a33ff4ed2684419131a0a8d9b9d7fd22d5a1024d  /tmp/v6_payload.tar.gz" | sha256sum --check
          tar -xzf /tmp/v6_payload.tar.gz -C .
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
          python -m compileall -q app.py web_store.py planning_tool
          pytest -q
      - name: Commit clean v6 implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .v6_payload .github/workflows/apply-v6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add supervisor weekly planning rules" || exit 0
          git push origin HEAD:feature/supervisor-planning-rules-v6
